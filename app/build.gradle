plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tomyn.bambureader'
    compileSdk 34

    // Cle de signature FIXE pour la version debug : sans elle, chaque build GitHub Actions genere une cle neuve
    // et Android refuse d'installer la mise a jour par-dessus l'ancienne version (desinstallation obligatoire).
    // Cette cle est publique (dans le depot) : elle ne prouve rien sur l'auteur, elle sert juste a garder la meme signature.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.tomyn.bambureader"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
}
